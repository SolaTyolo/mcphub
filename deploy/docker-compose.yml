services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
      POSTGRES_DB: llm
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d llm"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    ports:
      - "8000:8000"
    environment:
      WHISPER__MODEL: base

  markitdown:
    image: mcp/markitdown
    command: ["--http", "--host", "0.0.0.0", "--port", "3001"]
    ports:
      - "3001:3001"

  mcphub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      LLM_STORE_DSN: postgres://llm:llm@postgres:5432/llm?sslmode=disable
      LLM_BASE_URL: http://ollama:11434/v1
      WHISPER_BASE_URL: http://whisper:8000/v1
      MARKITDOWN_MCP_URL: http://markitdown:3001/mcp
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      whisper:
        condition: service_started
      markitdown:
        condition: service_started

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs_data:/data
    command: ["/data"]

volumes:
  pg_data:
  ollama_data:
  rustfs_data:
